    /* Complete Embedded Cyberpunk Neon Theme Rules */
    body {
      background-color: #080c14 !important;

      border: 1px solid #f97316 !important;

<body class="p-4 sm:p-8 min-h-screen">

          <span class="text-xs text-green-400 font-mono px-2 py-0.5 rounded bg-green-500 bg-opacity-10 border border-green-500 border-opacity-20">LIVE_STREAM</span>
        </div>
        
        <!-- Local Climatology Utility -->

          <div class="flex gap-2 mb-2">
            <input type="text" id="weatherCity" placeholder="Target location..." value="New York" class="cyber-input text-xs px-3 py-2 rounded-lg w-full font-medium">
            <button onclick="fetchPortalWeather()" class="text-xs font-bold bg-gray-900 hover:bg-gray-800 text-orange-400 px-4 py-2 rounded-lg border border-gray-800 transition-colors cursor-pointer">SYNC</button>

  <!-- CORE UTILITY ALGORITHMS -->
  <script>
    function executeGlobalSearch() {
      const engine = document.getElementById('engineSelect').value;
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return;
      
      let targetUrl = '';
      if (engine === 'google') targetUrl = `https://google.com{encodeURIComponent(input)}`;
      if (engine === 'duckduckgo') targetUrl = `https://duckduckgo.com{encodeURIComponent(input)}`;
      if (engine === 'bing') targetUrl = `https://bing.com{encodeURIComponent(input)}`;
      
      window.open(targetUrl, '_blank');
    }

    // Capture Enter key triggers
    setTimeout(() => {
      const searchInput = document.getElementById('searchInput');
      if(searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') executeGlobalSearch();
        });
      }
    }, 500);

    async function fetchPortalWeather() {
      const city = document.getElementById('weatherCity').value || 'New York';
      const target = document.getElementById('weatherTarget');
      const url = `https://wttr.in{encodeURIComponent(city)}?format=j1`;
      
      try {
