<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fenix Portal // Enterprise Dashboard</title>
  
  <!-- Stable Production CSS Engine -->
  <link href="https://cloudflare.com" rel="stylesheet">
  
  <style>
    /* Premium Minimalist Dark Theme */
    body {
      background-color: #090d16 !important;
      color: #f1f5f9 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.2) 0px, transparent 50%) !important;
      background-attachment: fixed !important;
    }
    
    .pro-card {
      background: rgba(17, 24, 39, 0.6) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 12px !important;
      transition: all 0.2s ease-in-out;
    }
    
    .pro-card:hover {
      border-color: rgba(249, 115, 22, 0.2) !important;
      background: rgba(17, 24, 39, 0.7) !important;
    }

    .pro-input {
      background-color: rgba(10, 15, 26, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      transition: all 0.2s ease;
    }
    .pro-input:focus {
      border-color: #f97316 !important;
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15) !important;
    }
    
    .pro-btn {
      background-color: #f97316 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      transition: all 0.2s ease;
    }
    .pro-btn:hover {
      background-color: #ea580c !important;
      transform: translateY(-0.5px);
    }

    select option {
      background-color: #0f172a !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  
  <div class="max-w-6xl mx-auto" style="margin-top: 1.5rem;">
    
    <!-- BRAND HEADER BLOCK -->
    <header class="flex justify-between items-center border-b border-gray-800 pb-5 mb-8">
      <div class="flex items-center space-x-3">
        <span class="text-xs font-mono tracking-widest text-gray-500 uppercase">System Network //</span>
        <h1 class="text-lg font-bold tracking-tight text-white">Fenix<span class="text-orange-500">Portal</span></h1>
      </div>
      <div class="flex items-center space-x-2 font-mono text-[11px] text-gray-400 bg-gray-900 px-3 py-1.5 rounded-md border border-gray-800">
        <span class="h-2 w-2 rounded-full bg-orange-500 inline-block"></span>
        <span>NODE_STATUS // ONLINE</span>
      </div>
    </header>

    <!-- BULLETPROOF DIRECT SEARCH PANEL -->
    <section class="pro-card p-3 flex flex-col md:flex-row gap-3 mb-8 items-center shadow-sm">
      <div class="w-full md:w-48 relative">
        <select id="engineSelect" class="pro-input w-full font-medium text-xs p-3 cursor-pointer appearance-none">
          <option value="google">Google Index</option>
          <option value="duckduckgo">DuckDuckGo Core</option>
          <option value="bing">Bing Intelligence</option>
        </select>
      </div>
      <div class="flex-1 flex gap-2 w-full">
        <input type="text" id="searchInput" placeholder="Enter universal web query..." class="pro-input w-full px-4 py-3 text-sm placeholder-gray-500">
        <button onclick="executeGlobalSearch()" class="pro-btn text-xs uppercase tracking-wider px-8 cursor-pointer whitespace-nowrap">
          Search
        </button>
      </div>
    </section>

    <!-- MULTI-FUNCTION UTILITY GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- DATA FEED AGGREGATOR -->
      <section class="pro-card p-6 flex flex-col justify-between" style="min-height: 360px;">
        <div>
          <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-4">
            <h2 class="text-xs font-semibold tracking-wider uppercase text-gray-400">Live Telemetry Feeds</h2>
            <span class="text-[10px] text-gray-500 font-mono">SECURE_SSL</span>
          </div>
          
          <!-- Climatology Module -->
          <div class="bg-gray-950 bg-opacity-40 p-4 rounded-lg border border-gray-900 mb-4">
            <div class="flex gap-2 mb-3">
              <input type="text" id="weatherCity" value="New York" class="pro-input text-xs px-3 py-2 w-full font-medium">
              <button onclick="fetchPortalWeather()" class="text-xs font-semibold bg-gray-900 hover:bg-gray-800 text-orange-500 px-4 py-2 rounded-md border border-gray-800 transition-colors cursor-pointer">Sync</button>
            </div>
            <div id="weatherTarget" class="text-sm text-gray-300 min-h-8 flex items-center font-medium">Establishing datastream connectivity...</div>
          </div>
        </div>

        <!-- Crypto Asset Matrix -->
        <div class="bg-gray-950 bg-opacity-40 p-4 rounded-lg border border-gray-900">
          <div class="text-[11px] font-bold text-gray-500 uppercase tracking-wider flex justify-between mb-2 border-b border-gray-900 pb-1">
            <span>Asset Metric</span><span>Market Valuation</span>
          </div>
          <div id="cryptoTarget" class="space-y-2 text-sm">Synchronizing decentral ledger...</div>
        </div>
      </section>

      <!-- ANALYTICAL COMPOUND INTEREST CALCULATOR -->
      <section class="pro-card p-6">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-4">
          <h2 class="text-xs font-semibold tracking-wider uppercase text-gray-400">Capital Growth Forecasting</h2>
          <span class="text-[10px] text-gray-500 font-mono">ENGINE_V4.2</span>
        </div>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-gray-400 font-medium mb-1">Initial Capital Base ($)</label>
            <input type="number" id="calcPrincipal" value="10000" class="pro-input w-full p-2.5 font-mono font-bold">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-gray-400 font-medium mb-1">Monthly Delta Input ($)</label>
              <input type="number" id="calcMonthly" value="500" class="pro-input w-full p-2.5 font-mono font-bold">
            </div>
            <div>
              <label class="block text-gray-400 font-medium mb-1">Target Yield Rate (%)</label>
              <input type="number" id="calcRate" value="8.5" step="0.1" class="pro-input w-full p-2.5 font-mono font-bold">
            </div>
          </div>
          <div>
            <label class="block text-gray-400 font-medium mb-1">Amortization Period (Years)</label>
            <input type="number" id="calcYears" value="10" class="pro-input w-full p-2.5 font-mono font-bold">
          </div>
          <button onclick="runYieldEngine()" class="pro-btn w-full py-3 text-xs uppercase tracking-wider font-bold transition-all cursor-pointer mt-2">
            Calculate Yield Horizon
          </button>
        </div>
        <div id="calcOutput" class="bg-gray-950 p-4 rounded-lg border border-gray-900 text-center font-mono text-sm text-green-400 font-bold hidden mt-4"></div>
      </section>

      <!-- GEOGRAPHIC DIRECTION ENGINE -->
      <section class="pro-card p-6 md:col-span-2">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-4">
          <h2 class="text-xs font-semibold tracking-wider uppercase text-gray-400">Transit Direction Routing</h2>
          <span class="text-[10px] text-gray-500 font-mono">EXTERNAL_MAPS</span>
        </div>
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="transitTarget" placeholder="Specify destination address or target node..." class="pro-input w-full px-4 py-3 text-xs">
          <button onclick="launchTransitRoute()" class="pro-input hover:bg-gray-950 text-xs font-semibold text-orange-500 px-6 py-3 tracking-wide whitespace-nowrap transition-all cursor-pointer">
            Plot Coordinates
          </button>
        </div>
      </section>

    </div>
  </div>

  <!-- APPLICATION COMPILER SCRIPT -->
  <script>
    // Bulletproof location injection route bypasses form blocks and popup exceptions
    function executeGlobalSearch() {
      const engine = document.getElementById('engineSelect').value;
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return;
      
      let targetUrl = '';
      if (engine === 'google') targetUrl = `https://google.com{encodeURIComponent(input)}`;
      if (engine === 'duckduckgo') targetUrl = `https://duckduckgo.com{encodeURIComponent(input)}`;
      if (engine === 'bing') targetUrl = `https://bing.com{encodeURIComponent(input)}`;
      
      // Updates the existing browser screen directly to match search query metrics completely safely
      window.location.href = targetUrl;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.getElementById('searchInput');
      if(searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') executeGlobalSearch();
        });
      }
    });

    async function fetchPortalWeather() {
      const city = document.getElementById('weatherCity').value.trim() || 'New York';
      const target = document.getElementById('weatherTarget');
      const url = `https://wttr.in{encodeURIComponent(city)}?format=j1`;
      
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Connection error");
        const data = await res.json();
