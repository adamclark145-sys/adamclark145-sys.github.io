<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fenix Portal</title>
  <!-- Tailwind CSS Engine for Layout Styling -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; transition: all 0.3s ease; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen">
  <main class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-xl font-bold tracking-wider text-orange-500">FENIX//PORTAL</h1>
      <button onclick="toggleTheme()" class="bg-slate-800 px-3 py-1.5 rounded text-xs hover:bg-slate-700 transition-colors">Toggle Theme</button>
    </header>

    <!-- SEARCH UTILITY -->
    <div class="glass-card p-4 rounded-xl shadow-lg flex flex-col sm:flex-row gap-3">
      <select id="engineSelect" class="bg-slate-800 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-orange-500">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
      </select>
      <div class="flex-1 flex gap-2">
        <input type="text" id="searchInput" placeholder="Scan the web interface..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-orange-500 text-white">
        <button onclick="executeGlobalSearch()" class="bg-orange-600 hover:bg-orange-500 px-6 py-2 rounded-lg font-medium text-sm transition-colors">Search</button>
      </div>
    </div>

    <!-- MAIN WIDGET GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- API FEEDS (WEATHER & CRYPTO) -->
      <div class="glass-card p-5 rounded-xl space-y-4">
        <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Live Network Feeds</h2>
        
        <!-- Weather Sub-Component -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800/80">
          <div class="flex gap-2 mb-2">
            <input type="text" id="weatherCity" placeholder="Enter city..." value="London" class="bg-slate-950 text-xs px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-orange-500 text-white w-full">
            <button onclick="fetchPortalWeather()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded transition-colors">Fetch</button>
          </div>
          <div id="weatherTarget" class="text-sm text-slate-300">Syncing weather grid...</div>
        </div>

        <!-- Crypto Sub-Component -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800/80 space-y-2">
          <div class="text-xs font-medium text-slate-400 flex justify-between">
            <span>Asset Stream</span><span>24h Change</span>
          </div>
          <div id="cryptoTarget" class="text-sm space-y-1">Fetching values...</div>
        </div>
      </div>

      <!-- FINANCE CALCULATOR -->
      <div class="glass-card p-5 rounded-xl space-y-4">
        <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Compound Interest Utility</h2>
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Starting Balance ($)</label>
            <input type="number" id="calcPrincipal" value="5000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Monthly Add ($)</label>
              <input type="number" id="calcMonthly" value="200" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Annual Return (%)</label>
              <input type="number" id="calcRate" value="8" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Timeline Horizon (Years)</label>
            <input type="number" id="calcYears" value="10" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
          </div>
          <button onclick="runYieldEngine()" class="w-full bg-orange-600 hover:bg-orange-500 py-2.5 rounded font-semibold text-white tracking-wide transition-colors mt-2">Compute Future Value</button>
        </div>
        <div id="calcOutput" class="bg-slate-950/60 p-3 rounded-lg border border-slate-800 text-center font-mono text-sm text-green-400 font-bold hidden"></div>
      </div>

      <!-- TRAVEL SHORTCUT ENGINE -->
      <div class="glass-card p-5 rounded-xl space-y-3 md:col-span-2">
        <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Transit Routing Engine</h2>
        <div class="flex gap-2">
          <input type="text" id="transitTarget" placeholder="Enter target address or city..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-orange-500 text-white">
          <button onclick="launchTransitRoute()" class="bg-slate-800 hover:bg-slate-700 text-xs text-orange-400 px-4 py-2 font-bold rounded-lg border border-orange-500/20 whitespace-nowrap transition-all">Plot Route</button>
        </div>
      </div>

    </div>
  </main>

  <!-- APPLICATION LOGIC INTERFACES -->
  <script>
    function executeGlobalSearch() {
      const engine = document.getElementById('engineSelect').value;
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return;
      
      let targetUrl = '';
      if (engine === 'google') targetUrl = `https://google.com{encodeURIComponent(input)}`;
      if (engine === 'duckduckgo') targetUrl = `https://duckduckgo.com{encodeURIComponent(input)}`;
      if (engine === 'bing') targetUrl = `https://bing.com{encodeURIComponent(input)}`;
      
      window.open(targetUrl, '_blank');
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeGlobalSearch();
    });

    async function fetchPortalWeather() {
      const city = document.getElementById('weatherCity').value || 'London';
      const target = document.getElementById('weatherTarget');
      const url = `https://wttr.in{encodeURIComponent(city)}?format=j1`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        const cond = data.current_condition[0];
        target.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-white">${city.toUpperCase()}</span>
            <span class="text-orange-400 font-semibold">${cond.temp_C}°C</span>
          </div>
          <div class="text-xs text-slate-400 mt-1">Condition: ${cond.weatherDesc[0].value} | Humidity: ${cond.humidity}%</div>
        `;
      } catch (err) {
        target.innerText = "Weather feed temporary disconnect.";
      }
    }

    async function fetchCryptoPrices() {
      const target = document.getElementById('cryptoTarget');
      const url = 'https://coingecko.com';
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        const btcUp = data.bitcoin.usd_24h_change >= 0;
        const ethUp = data.ethereum.usd_24h_change >= 0;
        
        target.innerHTML = `
          <div class="flex justify-between">
            <span class="text-white font-mono">BTC/USD</span>
            <span class="${btcUp ? 'text-green-400' : 'text-red-400'} font-mono">$${data.bitcoin.usd.toLocaleString()} (${data.bitcoin.usd_24h_change.toFixed(2)}%)</span>
          </div>
          <div class="flex justify-between mt-1">
            <span class="text-white font-mono">ETH/USD</span>
            <span class="${ethUp ? 'text-green-400' : 'text-red-400'} font-mono">$${data.ethereum.usd.toLocaleString()} (${data.ethereum.usd_24h_change.toFixed(2)}%)</span>
          </div>
        `;
      } catch (err) {
        target.innerText = "Asset server data delay.";
      }
    }

    function runYieldEngine() {
      const principal = parseFloat(document.getElementById('calcPrincipal').value) || 0;
      const monthly = parseFloat(document.getElementById('calcMonthly').value) || 0;
      const annualRate = (parseFloat(document.getElementById('calcRate').value) || 0) / 100;
      const years = parseInt(document.getElementById('calcYears').value) || 0;
      
      const monthlyRate = annualRate / 12;
      const totalMonths = years * 12;
      let balance = principal;
      
      for (let m = 0; m < totalMonths; m++) {
        balance = (balance + monthly) * (1 + monthlyRate);
      }
      
      const output = document.getElementById('calcOutput');
      output.innerText = `PROJECTED MATRIX BALANCE: $${balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      output.classList.remove('hidden');
    }

    function launchTransitRoute() {
      const query = document.getElementById('transitTarget').value.trim();
      if (!query) return;
      const url = `https://google.com{encodeURIComponent(query)}`;
      window.open(url, '_blank');
    }

    function toggleTheme() {
      const current = localStorage.getItem('portalTheme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
